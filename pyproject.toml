[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "bleedtracker"
version = "0.1.0.dev0"
description = "Ranks pages by how likely each one is to lose search impressions next month."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anad Čuruković" }]
requires-python = ">=3.14,<3.15"
dependencies = [
    "duckdb==2.0.0",
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "pandas==3.1.0",
    "scikit-learn==1.9.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]
notebooks = [
    "jupyterlab==4.6.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m \"not warehouse\""
markers = [
    "warehouse: reads the gated warehouse. Needs a token. Run with: pytest -m warehouse",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PD"]

[tool.ruff.format]
line-ending = "lf"
